# Alembic for @aitu_mentor_bot.
# Keep this file ASCII-only: alembic reads it with the OS locale encoding
# (cp1252 on Windows), so non-ASCII characters raise UnicodeDecodeError.
# Russian notes: CHANGES_SLICE1.md, CHANGES_SLICE2.md, context/10-bot-spec.md.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S