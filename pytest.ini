[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Тесты должны жить в том же event loop, что и сессионный движок: asyncpg привязывает
# соединение к циклу, и на Postgres иначе падает «attached to a different loop».
asyncio_default_test_loop_scope = session
testpaths = tests
